# Minimal CDI DataVolume CRD for envtest: the schema keeps unknown fields and
# there is no controller, so a test sets status.phase itself.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datavolumes.cdi.kubevirt.io
spec:
  group: cdi.kubevirt.io
  names:
    kind: DataVolume
    listKind: DataVolumeList
    plural: datavolumes
    singular: datavolume
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
