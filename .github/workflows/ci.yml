name: ci

on:
  push:
  pull_request:
    # edited: re-check the PR body when it changes.
    types: [opened, synchronize, reopened, edited]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: scripts/guard-agents.sh selftest
      - run: scripts/guard-agents.sh agents
      # Layer rules and the AGENTS.md rule table; -v puts the Judgment row count in the log.
      - run: go test -count=1 -v -run 'TestArchitectureRules|TestAgentsRuleTable' ./internal/archtest/
      # vws-lib is private and CI has no token for it: check the vendored copy against VENDOR only.
      - run: VWS_LIB_OFFLINE=1 scripts/vendor-lib.sh check
      - run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - run: echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path)" >> "$GITHUB_ENV"
      - run: go test -race -count=1 -timeout 120s ./...

  # English only: tracked files (with .github/english-allowlist), the PR body and the PR's commit messages.
  english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check-english.sh rejects bad inputs
        run: scripts/check-english.sh selftest
      - name: Tracked files are English
        run: scripts/check-english.sh files
      - name: PR body is English
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-english.sh text
      - name: Commit messages are English
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-english.sh commits "$BASE_SHA" "$HEAD_SHA"

  # Common golangci-lint baseline (vws-deploy .github/golangci-common.yml, vws-deploy#300).
  # fetch-depth 0 gives new-from-merge-base the origin/main history it compares against.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Lint
        run: golangci-lint run --timeout=5m ./...
      - name: Format (gofumpt, goimports)
        run: golangci-lint fmt --diff
