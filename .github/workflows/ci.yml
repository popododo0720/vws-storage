name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: scripts/guard-agents.sh selftest
      - run: scripts/guard-agents.sh agents
      # Layer rules and the AGENTS.md rule table; -v puts the Judgment row count in the log.
      - run: go test -count=1 -v -run 'TestArchitectureRules|TestAgentsRuleTable' ./internal/archtest/
      # vws-lib is private and CI has no token for it: check the vendored copy against VENDOR only.
      - run: VWS_LIB_OFFLINE=1 scripts/vendor-lib.sh check
      # Pinned like vws-network (#211). Moving a pin is a normal PR; TestEnvtestIsPinned refuses @latest or a bare use.
      - run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
      - run: echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.37.0 -p path)" >> "$GITHUB_ENV"
      - run: go test -race -count=1 -timeout 120s ./...

  # Common golangci-lint baseline (vws-deploy .github/golangci-common.yml, vws-deploy#300).
  # fetch-depth 0 gives new-from-merge-base the origin/main history it compares against.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Lint
        run: golangci-lint run --timeout=5m ./...
      - name: Format (gofumpt, goimports)
        run: golangci-lint fmt --diff

  # /correct loop guard (vws-deploy#448). It runs here because repo-guard.yml is only the pinned
  # vws-deploy caller (vws-deploy docs/design/repo-guard-reusable.md).
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md has the /correct loop, incident form and label (vws-deploy#448)
        run: scripts/guard.sh correct
      - name: guard.sh fails on an empty /correct loop section
        run: scripts/guard_test.sh
