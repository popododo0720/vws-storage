# Publishes the vws-storage image (#127) on a push to main.
# ko builds ./cmd/vws-storage onto a distroless base, so the repository keeps no Dockerfile
# (TestRepoPolicy still rejects deployment manifests). The binary is pure Go
# (CGO_ENABLED=0, ko's default), so the static distroless base is enough.
# Tag: sha-<7-char commit>, immutable by convention: no job writes the same tag twice for another commit.
# Labels: org.opencontainers.image.revision is the full commit SHA; org.opencontainers.image.source
# is this repository, so a new package is linked to it (and inherits its Actions access).
# workflow_dispatch publishes an older commit on main (e.g. the one vws-deploy pins) the same way.
# Package visibility is not set here. It is changed only by hand in the package settings.
# The last step runs the published image and waits for /readyz, so an image that cannot start
# fails the publish run.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit on main to publish (full or short SHA). Empty means the main head.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/vws/storage
  # gcr.io/distroless/static-debian12:nonroot (uid 65532), the base of the images vws-test ran.
  KO_DEFAULTBASEIMAGE: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the commit
        id: rev
        env:
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify "${REF:-HEAD}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::${sha} is not on main"; exit 1; }
          git checkout --detach "$sha"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 "$sha")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1
      # setup-ko logs in to ghcr.io only when KO_DOCKER_REPO is unset; it is set above, so it
      # skipped the login and the push was anonymous. Log in here.
      # The token reaches ko only on stdin, never in args or output.
      - name: Log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ko login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and push
        id: push
        env:
          SHA: ${{ steps.rev.outputs.sha }}
          SHORT: ${{ steps.rev.outputs.short }}
        run: |
          set -euo pipefail
          ref=$(ko build ./cmd/vws-storage --bare --platform=linux/amd64 --sbom=none \
            --tags "sha-${SHORT}" \
            --image-label "org.opencontainers.image.revision=${SHA}" \
            --image-label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}")
          echo "image=${ref}" >> "$GITHUB_OUTPUT"
          echo "storage ${KO_DOCKER_REPO}:sha-${SHORT} = ${ref} (revision ${SHA})" | tee -a "$GITHUB_STEP_SUMMARY"
      # A published image that cannot start is a failed publish. The defaults use the in-memory
      # store and the fake backends, so /readyz turns 200 without a cluster or an S3 endpoint.
      - name: Smoke the image
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          name=vws-storage-smoke
          cleanup() { docker rm --force "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$name" \
            --publish 127.0.0.1:18080:8080 \
            --env VWS_HEALTH_ADDR=:8080 \
            "$IMAGE"
          # /readyz is 200 from the moment obs.Setup starts, before the storage check is
          # registered. Wait for the "serving" line, which main.go writes after the engine,
          # the gRPC listener and that check are in place.
          serving=
          for _ in $(seq 1 30); do
            if docker logs "$name" 2>&1 | grep -q '"msg":"serving"'; then
              serving=1
              break
            fi
            sleep 1
          done
          if [[ -z $serving ]]; then
            docker logs "$name" || true
            echo "::error::the published image did not reach serving" >&2
            exit 1
          fi
          ready=
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ -z $ready ]]; then
            docker logs "$name" || true
            echo "::error::the published image did not become ready" >&2
            exit 1
          fi
          curl -fsS --max-time 5 http://127.0.0.1:18080/healthz
          curl -fsS --max-time 5 http://127.0.0.1:18080/readyz
          docker logs "$name" | tail -n 20
